<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBRAKIT — Simulador ecommerce CRO</title>
<style>
:root{--orange:#f36f21;--dark:#222;--muted:#666;--bg:#f5f5f5;--card:#fff;--border:#ddd}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.nav{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px;padding:14px 18px}
.logo{font-weight:900;font-size:26px;color:var(--orange);cursor:pointer;white-space:nowrap}
.search{flex:1;display:flex}.search input{width:100%;padding:11px 13px;border:1px solid #bbb;border-radius:6px 0 0 6px;font-size:15px}.search button{border:0;background:var(--orange);color:#fff;padding:0 18px;border-radius:0 6px 6px 0;cursor:pointer}
.nav button{background:none;border:0;cursor:pointer;font-size:14px}.cart{font-weight:bold}
main{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
.hero{background:#fff;padding:34px;border-radius:10px;margin-bottom:24px}.hero h1{margin-top:0;font-size:34px}.hero p{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;background:var(--orange);color:#fff;padding:11px 16px;border-radius:6px;cursor:pointer;font-weight:bold}.btn.secondary{background:#333}.btn.light{background:#eee;color:#222}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:16px}.pic{height:145px;background:#eee;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:12px}.card h3{font-size:16px;min-height:38px}.price{font-size:21px;font-weight:800;margin:10px 0}.muted{color:var(--muted);font-size:13px}
.breadcrumb{color:var(--muted);font-size:13px;margin-bottom:15px}
.product{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:#fff;padding:24px;border-radius:10px}.product .pic{height:360px;font-size:100px}
.qty{display:flex;align-items:center;gap:8px;margin:15px 0}.qty input{width:65px;padding:9px;border:1px solid #bbb;border-radius:5px}
.panel{background:#fff;padding:22px;border-radius:10px;margin-bottom:18px}.row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.notice{background:#fff6ed;border:1px solid #ffd2b2;padding:13px;border-radius:7px;margin:15px 0}
.form{max-width:620px}.form label{display:block;font-weight:bold;margin:14px 0 6px}.form input,.form select{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px}
footer{background:#222;color:#fff;padding:28px;text-align:center}
.empty{text-align:center;padding:50px;background:#fff;border-radius:10px}
@media(max-width:700px){.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}.product{grid-template-columns:1fr}.product .pic{height:240px}.hero h1{font-size:27px}}
</style>


</head>
<body>

  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PQNP54ZV"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header>
  <div class="nav">
    <div class="logo" onclick="go('home')">OBRAKIT</div>
    <div class="search">
      <input id="searchInput" placeholder="¿Qué necesitas?" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">Buscar</button>
    </div>
    <button onclick="go('account')">Mi cuenta</button>
    <button class="cart" onclick="go('cart')">🛒 <span id="cartCount">0</span></button>
  </div>
</header>

<main id="app"></main>
<footer>OBRAKIT · Entorno ficticio para prácticas de CRO, GTM y GA4</footer>

<script>
window.dataLayer = window.dataLayer || [];

const products = [
 {id:"ATORNILLADOR-001",name:"Atornillador eléctrico básico",price:9.95,cat:"Herramientas",icon:"🔧"},
 {id:"BROCAS-002",name:"Juego de brocas y puntas 25 piezas",price:12.95,cat:"Herramientas",icon:"🪛"},
 {id:"FLEX-003",name:"Portapuntas flexible + 11 puntas",price:11.95,cat:"Herramientas",icon:"🧰"},
 {id:"CINTA-004",name:"Cinta métrica 5 m",price:6.50,cat:"Herramientas",icon:"📏"},
 {id:"GUANTES-005",name:"Guantes de trabajo",price:4.95,cat:"Protección",icon:"🧤"},
 {id:"TORNILLOS-006",name:"Caja de tornillos multiuso",price:8.90,cat:"Ferretería",icon:"🔩"}
];

let cart = JSON.parse(localStorage.getItem("obrakit_cart") || "[]");
let currentProductId = null;

function pushEvent(event, data={}){
  const payload = {event, ...data};
  window.dataLayer.push(payload);
  console.log("[OBRAKIT dataLayer]", payload);
}

function itemsFor(ids){
  return ids.map(id=>{
    const p=products.find(x=>x.id===id);
    return p ? {item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:1} : null;
  }).filter(Boolean);
}

function cartItems(){
  return cart.map(x=>{
    const p=products.find(y=>y.id===x.id);
    return p ? {...p,quantity:x.quantity} : null;
  }).filter(Boolean);
}

function cartValue(){return cartItems().reduce((s,p)=>s+p.price*p.quantity,0)}

function saveCart(){localStorage.setItem("obrakit_cart",JSON.stringify(cart));updateCartCount()}
function updateCartCount(){document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.quantity,0)}
function money(n){return n.toFixed(2).replace(".",",")+" €"}

function go(page,param){
  if(page==="home") renderHome();
  if(page==="category") renderCategory();
  if(page==="product") renderProduct(param);
  if(page==="cart") renderCart();
  if(page==="checkout") renderCheckout();
  if(page==="account") renderAccount();
}

function layout(content){document.getElementById("app").innerHTML=content;updateCartCount()}

function renderHome(){
 layout(`<section class="hero">
   <h1>Todo para tus proyectos</h1>
   <p>Simulación de ecommerce para practicar medición de CRO con GTM + GA4.</p>
   <div class="actions"><button class="btn" onclick="go('category')">Ver herramientas</button><button class="btn secondary" onclick="go('account')">Mi cuenta</button></div>
 </section>
 <h2>Productos destacados</h2>
 <div class="grid">${products.slice(0,4).map(card).join("")}</div>`);
 pushEvent("page_view",{page_title:"Inicio",page_location:location.href});
}

function card(p){
 return `<article class="card">
   <div class="pic">${p.icon}</div>
   <div class="muted">${p.cat}</div>
   <h3>${p.name}</h3>
   <div class="price">${money(p.price)}</div>
   <button class="btn" onclick="go('product','${p.id}')">Ver producto</button>
 </article>`;
}

function renderCategory(){
 layout(`<div class="breadcrumb">Inicio / Herramientas</div><h1>Herramientas</h1>
 <div class="grid">${products.filter(p=>p.cat==="Herramientas").map(card).join("")}</div>`);
 pushEvent("view_item_list",{item_list_id:"herramientas",item_list_name:"Herramientas",items:itemsFor(products.filter(p=>p.cat==="Herramientas").map(p=>p.id))});
 pushEvent("page_view",{page_title:"Categoría Herramientas",page_location:location.href});
}

function renderProduct(id){
 currentProductId=id;
 const p=products.find(x=>x.id===id);
 if(!p)return go("home");
 layout(`<div class="breadcrumb">Inicio / ${p.cat} / ${p.name}</div>
 <section class="product">
  <div class="pic">${p.icon}</div>
  <div>
   <div class="muted">${p.cat}</div>
   <h1>${p.name}</h1>
   <div class="price">${money(p.price)}</div>
   <p>Producto ficticio para practicar eventos ecommerce. Stock disponible en OBRAKIT Usera.</p>
   <div class="notice"><b>Compra en almacén:</b> disponible · <b>Recogida:</b> disponible en 2 h · <b>Envío:</b> disponible</div>
   <div class="qty"><label>Cantidad <input id="qty" type="number" min="1" value="1"></label></div>
   <div class="actions"><button class="btn" onclick="addToCart('${p.id}')">Añadir al carrito</button><button class="btn light" onclick="go('category')">Volver</button></div>
  </div>
 </section>
 <section class="panel"><h2>Frecuentemente comprados juntos</h2>
   <p>Portapuntas flexible + 11 puntas · ${money(products[2].price)}</p>
   <button class="btn light" onclick="crossSell('${products[2].id}')">Ver complemento</button>
 </section>`);
 pushEvent("page_view",{page_title:"Producto "+p.name,page_location:location.href});
 pushEvent("view_item",{currency:"EUR",value:p.price,items:[{item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:1}]});
 pushEvent("cross_sell_view",{source_product_id:p.id,recommended_product_id:products[2].id});
}

function addToCart(id){
 const qty=Math.max(1,parseInt(document.getElementById("qty")?.value||1));
 const p=products.find(x=>x.id===id);
 const existing=cart.find(x=>x.id===id);
 if(existing) existing.quantity+=qty; else cart.push({id,quantity:qty});
 saveCart();
 pushEvent("add_to_cart",{currency:"EUR",value:p.price*qty,items:[{item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:qty}]});
 go("cart");
}

function crossSell(id){
 pushEvent("cross_sell_click",{recommended_product_id:id,source_product_id:currentProductId});
 go("product",id);
}

function removeItem(id){
 const p=products.find(x=>x.id===id);
 const old=cart.find(x=>x.id===id);
 cart=cart.filter(x=>x.id!==id);saveCart();
 pushEvent("remove_from_cart",{currency:"EUR",value:p.price*(old?.quantity||1),items:[{item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:old?.quantity||1}]});
 renderCart();
}

function renderCart(){
 if(!cart.length){layout(`<div class="empty"><h1>Tu carrito está vacío</h1><p>Añade un producto para continuar.</p><button class="btn" onclick="go('category')">Ver productos</button></div>`);return}
 const items=cartItems();
 layout(`<div class="breadcrumb">Inicio / Carrito</div><h1>Tu carrito</h1>
 <section class="panel">${items.map(p=>`<div class="row"><div><b>${p.name}</b><div class="muted">Cantidad: ${p.quantity}</div></div><div>${money(p.price*p.quantity)} <button class="btn light" onclick="removeItem('${p.id}')">Eliminar</button></div></div>`).join("")}</section>
 <section class="panel"><div class="row"><b>Total</b><b>${money(cartValue())}</b></div><button class="btn" onclick="beginCheckout()">Continuar al checkout</button></section>`);
 pushEvent("view_cart",{currency:"EUR",value:cartValue(),items:items.map(p=>({item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:p.quantity}))});
}

function beginCheckout(){
 pushEvent("begin_checkout",{currency:"EUR",value:cartValue(),items:cartItems().map(p=>({item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:p.quantity}))});
 go("checkout");
}

function renderCheckout(){
 layout(`<div class="breadcrumb">Inicio / Checkout</div><h1>Finalizar pedido</h1>
 <section class="panel">
  <h2>1. Tipo de cliente</h2>
  <select id="customerType" onchange="selectCustomerType(this.value)">
   <option value="">Selecciona una opción</option><option value="particular">Particular</option><option value="autonomo">Autónomo</option><option value="empresa">Empresa</option>
  </select>
 </section>
 <section class="panel">
  <h2>2. Método de entrega</h2>
  <div class="actions">
   <button class="btn light" onclick="selectDelivery('pickup')">Recogida en Usera</button>
   <button class="btn light" onclick="selectDelivery('shipping')">Envío</button>
  </div>
  <div id="deliveryStatus" class="notice">Selecciona un método.</div>
 </section>
 <section class="panel">
  <h2>3. Pago</h2>
  <p>Simulación: no se realiza ningún cobro real.</p>
  <button class="btn" onclick="pay()">Pagar y realizar pedido</button>
 </section>
 <section class="panel"><div class="row"><b>Total</b><b>${money(cartValue())}</b></div></section>`);
}

function selectCustomerType(type){
 localStorage.setItem("obrakit_customer_type",type);
 pushEvent("customer_type_selected",{customer_type:type});
}

function selectDelivery(type){
 localStorage.setItem("obrakit_delivery",type);
 const label=type==="pickup"?"Recogida en OBRAMAT Usera":"Envío a domicilio";
 document.getElementById("deliveryStatus").innerHTML="<b>Seleccionado:</b> "+label;
 pushEvent("delivery_option_select",{delivery_type:type,warehouse:"Usera",cart_value:cartValue()});
}

function pay(){
 const customerType=localStorage.getItem("obrakit_customer_type");
 const delivery=localStorage.getItem("obrakit_delivery");
 if(!customerType || !delivery){
   pushEvent("purchase_error",{reason:"missing_checkout_selection",customer_type:customerType||"",delivery_type:delivery||""});
   alert("Selecciona tipo de cliente y método de entrega.");
   return;
 }
 pushEvent("add_payment_info",{payment_type:"card",currency:"EUR",value:cartValue()});
 const transaction="OBK-"+Date.now();
 pushEvent("purchase",{transaction_id:transaction,currency:"EUR",value:cartValue(),tax:0,shipping:delivery==="shipping"?0:0,customer_type:customerType,delivery_type:delivery,warehouse:"Usera",items:cartItems().map(p=>({item_id:p.id,item_name:p.name,item_category:p.cat,price:p.price,quantity:p.quantity}))});
 cart=[];saveCart();
 layout(`<div class="panel"><h1>Pedido realizado correctamente</h1><p>Gracias por comprar en OBRAKIT.</p><div class="notice">Pedido <b>${transaction}</b> · ${delivery==="pickup"?"Recogida en Usera":"Envío"}</div><button class="btn" onclick="go('home')">Volver al inicio</button></div>`);
}

function doSearch(){
 const q=document.getElementById("searchInput").value.trim();
 if(!q)return;
 const results=products.filter(p=>(p.name+" "+p.cat).toLowerCase().includes(q.toLowerCase()));
 pushEvent("search",{search_term:q,results_count:results.length});
 layout(`<div class="breadcrumb">Búsqueda / ${q}</div><h1>Resultados para “${q}”</h1>
 <div class="grid">${results.length?results.map(card).join(""):"<div class='empty'><h2>No encontramos productos</h2><p>Prueba con otro término.</p></div>"}</div>`);
 pushEvent("page_view",{page_title:"Resultados búsqueda",search_term:q,page_location:location.href});
 if(results.length)pushEvent("view_item_list",{item_list_id:"search",item_list_name:"Búsqueda",search_term:q,items:itemsFor(results.map(p=>p.id))});
}

function renderAccount(){
 const type=localStorage.getItem("obrakit_customer_type")||"";
 layout(`<div class="panel form"><h1>Mi cuenta</h1>
 <p class="muted">Área ficticia para practicar login, registro y segmentación.</p>
 <label>Tipo de cliente</label><select onchange="selectCustomerType(this.value)"><option value="">Selecciona</option><option value="particular" ${type==="particular"?"selected":""}>Particular</option><option value="autonomo" ${type==="autonomo"?"selected":""}>Autónomo</option><option value="empresa" ${type==="empresa"?"selected":""}>Empresa</option></select>
 <label>Email</label><input id="email" type="email" placeholder="tu@email.com">
 <label>Contraseña</label><input id="password" type="password" placeholder="••••••••">
 <div class="actions" style="margin-top:18px"><button class="btn" onclick="login()">Iniciar sesión</button><button class="btn light" onclick="register()">Crear cuenta</button></div>
 </div>`);
 pushEvent("account_view",{});
}

function login(){
 const email=document.getElementById("email").value.trim();
 if(!email){
  pushEvent("login_error",{reason:"missing_email"});
  alert("Introduce un email.");
  return;
 }
 pushEvent("login",{method:"email"});
 alert("Login simulado correctamente.");
}

function register(){
 const email=document.getElementById("email").value.trim();
 const type=document.querySelector("#app select")?.value||"";
 if(!email||!type){
  pushEvent("register_error",{reason:"missing_required_field",customer_type:type||""});
  alert("Completa email y tipo de cliente.");
  return;
 }
 pushEvent("register",{method:"email",customer_type:type});
 alert("Registro simulado correctamente.");
}

renderHome();
</script>
</body>
</html>
